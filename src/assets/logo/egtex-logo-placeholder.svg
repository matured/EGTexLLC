<!--
  Wordmark logo for EGTex Broker LLC ("Star & Route" direction).
  Sits on navy backgrounds (navbar, footer) — text colors are chosen
  for that context, not for use on a light background.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 76" role="img" aria-labelledby="egtexLogoTitle">
  <title id="egtexLogoTitle">EGTex Broker LLC</title>
  <g transform="translate(0,6)">
    <rect width="64" height="64" rx="14" fill="#0B1F3A" />
    <polygon
      points="32,7.7 36.5,20.7 50.3,20.9 39.3,29.3 43.3,42.4 32,34.6 20.7,42.4 24.7,29.3 13.7,20.9 27.5,20.7"
      fill="#FFFFFF"
    />
    <rect x="6.4" y="50" width="51.2" height="6.4" rx="3.2" fill="#BF0A30" />
    <rect x="12.8" y="52.6" width="6.4" height="1.3" fill="#FFFFFF" />
    <rect x="28.8" y="52.6" width="6.4" height="1.3" fill="#FFFFFF" />
    <rect x="44.8" y="52.6" width="6.4" height="1.3" fill="#FFFFFF" />
  </g>
  <text
    x="78"
    y="38"
    font-family="Archivo, 'Arial Black', sans-serif"
    font-weight="900"
    font-size="27"
    fill="#FFFFFF"
  >EGTEX</text>
  <text
    x="172"
    y="38"
    font-family="Archivo, 'Arial Black', sans-serif"
    font-weight="800"
    font-size="27"
    fill="#BF0A30"
  >BROKER</text>
  <text
    x="79"
    y="56"
    font-family="Inter, sans-serif"
    font-weight="600"
    font-size="11"
    letter-spacing="3"
    fill="#9AA5B1"
  >L L C</text>
</svg>
